services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./rsalgotrainer
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
